# 배포 프로파일. SPRING_PROFILES_ACTIVE=prod 로 켠다 — application.yaml 위에 이 값만 덮는다.
# 여기에는 "배포라서 값이 달라지는 것"만 둔다. 비밀값은 여전히 환경변수로 받는다.
app:
  auth:
    # 배포는 https 뒤에 있으므로 refresh 쿠키에 Secure 를 켠다.
    cookie-secure: true
  cors:
    # 기본값을 주지 않는다 — 배포에서 프론트 오리진을 안 넣으면 localhost 로
    # 조용히 뜨는 대신 부팅에서 실패하는 쪽이 낫다. 도메인이 확정되면 여기 박아도 된다.
    allowed-origins: ${CORS_ALLOWED_ORIGINS}
