spring:
  application:
    name: backend

  # .env 는 backend·frontend 가 각각 들고 있다. 실제 환경변수가 있으면 그쪽이 이긴다.
  config:
    import:
      - optional:file:./.env[.properties]

  datasource:
    url: jdbc:postgresql://${DB_HOST}:${DB_PORT}/${DB_NAME}
    username: ${DB_USER}
    password: ${DB_PASSWORD}

  jpa:
    hibernate:
      # 엔티티가 스키마의 단일 진실 원천. JPA 가 테이블을 만든다.
      ddl-auto: update
    open-in-view: false
    properties:
      hibernate:
        format_sql: true
        jdbc:
          time_zone: Asia/Seoul

  data:
    redis:
      host: ${REDIS_HOST}
      port: ${REDIS_PORT}
