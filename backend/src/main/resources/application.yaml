spring:
  application:
    name: backend

  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:antenna}
    username: ${DB_USER:antenna}
    password: ${DB_PASSWORD:antenna}

  jpa:
    hibernate:
      # 스키마 확정 전까지만. 설계 끝나면 Flyway 로 옮긴다.
      ddl-auto: update
    open-in-view: false
    properties:
      hibernate:
        format_sql: true
        jdbc:
          time_zone: Asia/Seoul

  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
