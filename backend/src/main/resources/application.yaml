spring:
  application:
    name: backend

  # .env 는 backend·frontend 가 각각 들고 있다. 실제 환경변수가 있으면 그쪽이 이긴다.
  config:
    import:
      - optional:file:./.env[.properties]

  # 업로드 상한(ANT-COMMUNITY-06). app.uploads.max-bytes(5MB) 보다 <b>커야</b> 한다 —
  # 같은 값이면 서블릿이 먼저 끊어 서비스의 검사가 영영 실행되지 않고, 더 작으면 5MB 이하
  # 파일까지 컨테이너가 잘라낸다. 여기는 마지막 방어선이고 실제 상한은 app.uploads 쪽이다.
  servlet:
    multipart:
      max-file-size: 6MB
      max-request-size: 8MB

  datasource:
    url: jdbc:postgresql://${DB_HOST}:${DB_PORT}/${DB_NAME}
    username: ${DB_USER}
    password: ${DB_PASSWORD}

  jpa:
    hibernate:
      # 엔티티가 스키마의 단일 진실 원천. JPA 가 테이블을 만든다.
      ddl-auto: update
    open-in-view: false
    # append-only 트리거는 Hibernate 가 못 만든다. 테이블이 생긴 뒤 db/append-only.sql 을 돌린다.
    defer-datasource-initialization: true
    properties:
      hibernate:
        format_sql: true
        jdbc:
          time_zone: Asia/Seoul

  sql:
    init:
      mode: always
      schema-locations: classpath:db/append-only.sql
      # plpgsql 함수 본문의 세미콜론을 문장 구분자로 쪼개지 않도록 파일 전체를 한 문장으로 보낸다.
      separator: "^^^ END OF SCRIPT ^^^"

  data:
    redis:
      host: ${REDIS_HOST}
      port: ${REDIS_PORT}

  security:
    oauth2:
      client:
        registration:
          google:
            client-id: ${GOOGLE_CLIENT_ID}
            client-secret: ${GOOGLE_CLIENT_SECRET}
            scope: openid,email,profile

  # 한국수출입은행 환율 API 전용 신뢰 묶음(ANT-DATA-04). KoreaeximFxClient 만 쓴다 — 다른
  # 외부 호출(구글·SSAFY·포털)은 JDK 기본 신뢰 저장소 그대로다. 왜 필요한지는 crt 파일 머리말에.
  ssl:
    bundle:
      pem:
        koreaexim:
          truststore:
            certificate: classpath:certs/koreaexim-ca.crt

app:
  auth:
    jwt-secret: ${JWT_SECRET}
    access-ttl-minutes: ${JWT_ACCESS_TTL_MINUTES}
    refresh-ttl-days: ${JWT_REFRESH_TTL_DAYS}
    # 로컬은 http 라 Secure 쿠키를 못 쓴다. 배포 환경에서 COOKIE_SECURE=true 로 켠다.
    cookie-secure: ${COOKIE_SECURE:false}
    # SSAFY SSO. 구글과 달리 스프링의 client registration 을 쓰지 않는다 —
    # 빈 client-id 로 등록하면 자격증명이 없는 팀원의 앱이 부팅부터 실패한다.
    # 자격증명이 없으면 SsafyOAuthClient 가 501 을 돌려주고 나머지 기능은 그대로 뜬다.
    #
    # 주소와 필드명은 개발자센터 문서로 확정된 값이라 환경변수로 받지 않는다.
    # 인가 요청 주소(/oauth/sso-check)만 접두사가 다르고 나머지는 /ssafy 아래다.
    ssafy:
      client-id: ${SSAFY_CLIENT_ID:}
      client-secret: ${SSAFY_CLIENT_SECRET:}
      token-uri: https://project.ssafy.com/ssafy/oauth2/token
      user-info-uri: https://project.ssafy.com/ssafy/resources/userInfo
      # userInfo 응답은 userId·email·name 세 개뿐이고 userId 만 고정 제공이다.
      # email·name 은 필수 동의일 때만 온다 — 매칭 키를 userId 로 잡아야 하는 이유다.
      user-name-attribute: userId
      email-attribute: email
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173}

  # 이미지 업로드(ANT-COMMUNITY-06). 저장 위치는 1차 결정으로 로컬 볼륨이다 —
  # 컨테이너에서는 UPLOAD_DIR 을 볼륨으로 마운트해야 재배포에 파일이 날아가지 않는다.
  # S3 로 옮길 때 바뀌는 코드는 LocalFileStorage 하나다.
  uploads:
    dir: ${UPLOAD_DIR:./uploads}
    # 실제 용량 상한. spring.servlet.multipart.max-file-size 는 이보다 크게 둔다.
    max-bytes: 5242880
    # 가로×세로 상한(4000만 화소 = 8000×5000). 용량이 작아도 헤더가 큰 크기를 선언할 수 있다.
    max-pixels: 40000000
    # 배너 가로/세로. 화면설계서로 확정되지 않아 조절 손잡이로 남긴다 — 시안이 나오면 이 값만 바꾼다.
    ad-aspect-ratio: 4.0
    ad-aspect-tolerance: 0.05

  # 광고 게재(ANT-COMMUNITY-05). 경매가 아니라 고정 단가 × 기간제 선착순이다.
  ads:
    # 1 ANT/일. 금액표(D4)가 확정되면 이 값을 바꾼다.
    price-per-day-wei: ${AD_PRICE_PER_DAY_WEI:1000000000000000000}
    # 메인 배너 자리가 하나다. 자리를 늘리면 이 값만 올린다.
    slot-count: 1
    max-days: 30
    # 확정을 기다리는 신청이 자리를 잡고 있는 시간. 접수는 토큰을 차감하지 않으므로 이 창이
    # 없으면 신청만 해 두고 소각 tx 를 보내지 않는 계정이 공짜로 자리를 막는다.
    pending-grace-minutes: 10

  # 온체인 (ANT-CHAIN-01~). 컨트랙트 주소는 재배포마다 바뀌므로 환경변수로만 받는다.
  chain:
    # 서명 payload(SignatureGuard)와 tx 서명(릴레이어)에 박힌다. 원천은 env CHAIN_ID 하나 — 31221 = SSAFY.
    chain-id: ${CHAIN_ID:31337}
    # 웹소켓 RPC. 비어 있으면 릴레이어만 꺼지고 앱은 뜬다(주소·키도 같은 규칙).
    rpc-url: ${CHAIN_RPC_URL:}
    # 앵커 tx 를 보내는 서버 키. CommitAnchor 의 ANCHOR_ROLE 만 갖는다 — 관리자 키는 서버 밖.
    relayer:
      private-key: ${RELAYER_PRIVATE_KEY:}
    commit-anchor:
      # 비어 있어도 앱이 뜬다 — 컨트랙트를 배포하지 않은 팀원의 로컬을 죽이지 않는다.
      # 실제 tx 전송은 릴레이어(ANT-CHAIN-05)가 CommitAnchorProperties.isDeployed() 로 막는다.
      address: ${CONTRACT_COMMIT_ANCHOR:}
    # 앵커 배치(ANT-CHAIN-02). 매일 00:05 KST, 주말 포함 — 앵커는 시세가 필요 없고 주말 등록분을
    # 월요일까지 무보호로 두면 안 된다. 실행 시각에 anchor_batch_id 가 NULL 인 커밋 전부가 한 배치다.
    anchor:
      cron: ${ANCHOR_CRON:0 5 0 * * *}
      # receipt 를 이만큼 기다리고 못 받으면 "전송됨·미확정"으로 둔다. 다음 실행이 rootOf 로 확인한다.
      receipt-timeout-seconds: 60
      # RPC 장애일 때만 즉시 재시도. revert 는 다시 보내도 같아서 재시도하지 않는다.
      retry:
        count: 3
        delay-seconds: 10
    # 앵커 인덱서(ANT-CHAIN-04). CommitAnchor 의 Anchored 이벤트를 eth_getLogs 로 폴링해 chain_events 에 적재하고
    # anchor_batches 를 체인 기준으로 맞춘다. ws 구독이 아닌 이유: 재시작·재연결이 커서(max block_number)만으로 끝난다.
    # RPC URL 과 컨트랙트 주소가 있어야 돈다 — 릴레이어 키는 필요 없다(읽기 전용).
    indexer:
      cron: ${INDEXER_CRON:*/5 * * * * *}
      # DB 에 이벤트가 없을 때의 시작 블록. SSAFY 는 컨트랙트 배포 블록(contracts/deployments/ssafy.json)을 넣으면
      # 첫 동기화가 한 회차로 끝난다. 0 이면 제네시스부터 max-block-range 단위로 훑는다.
      from-block: ${INDEXER_FROM_BLOCK:0}
      max-block-range: 10000

  # DART 전자공시 수집(ANT-RESEARCH-01). 주소는 문서로 확정된 값이라 환경변수로 받지 않는다.
  # 키가 비어 있으면 수집을 건너뛴다 — 키 없는 팀원의 로컬도 그대로 부팅된다.
  dart:
    api-key: ${DART_API_KEY:}
    # 공시 목록을 되돌아보며 훑을 구간(일). 접수번호가 멱등 키라 겹쳐 받아도 중복이 안 생긴다.
    lookback-days: 7
    # 주기가 셋으로 갈린다. 매일 달라지는 것은 공시 목록뿐이다.
    disclosure-cron: "0 30 19 * * *"
    profile-cron: "0 0 4 1 * *"
    financial-cron: "0 0 5 1 1,4,7,10 *"

  # 공공데이터포털 「금융위원회_주식시세정보」 일봉 수집(ANT-DATA-02).
  market-data:
    # 포털이 인증키를 Encoding/Decoding 두 벌로 준다. 여기에는 Decoding 키를 넣는다 —
    # 코드가 한 번 더 인코딩하므로 Encoding 키를 넣으면 두 번 인코딩돼
    # SERVICE_KEY_IS_NOT_REGISTERED_ERROR 로 돌아온다. 비어 있으면 수집을 건너뛴다.
    service-key: ${PUBLIC_DATA_SERVICE_KEY:}
    # 주소는 문서로 확정된 값이라 환경변수로 받지 않는다(SSAFY SSO 와 같은 규칙).
    base-url: https://apis.data.go.kr/1160100/service/GetStockSecuritiesInfoService
    # 상장 종목이 3천 안팎이라 하루가 3콜로 끝난다. 일 1만 콜 한도 안에서 백필이 돈다.
    page-size: 1000
    # 팀 결정 — 데이터 양을 줄이려고 KOSPI 시가총액 상위 300 종목만 수집한다.
    # 시장은 포털의 mrktCls 파라미터로도 걸러져 하루가 1콜로 준다. 상위 N 은 포털에
    # 잘라 주는 파라미터가 없어 받은 뒤 시가총액(mrktTotAmt)으로 고른다 — 날짜마다 그날
    # 기준이라 백필에서는 경계 근처 종목이 들고날 수 있다. 전 종목으로 돌리려면 둘 다 지운다.
    market-filter: KOSPI
    top-count: 300
    # 되돌아보며 메울 구간. 연휴와 실패 회차를 함께 덮는다 —
    # 주말 낀 월요일이 금요일치를 이 창에서 집는다.
    lookback-days: 10
    # 영업일 13:00 KST. 장 마감(15:30) 전이라 오늘이 아니라 어제까지를 받는다.
    cron: "0 0 13 * * MON-FRI"

    # 과거 시세 백필(ANT-DATA-03). 정기 수집과 같은 길을 쓰되 창만 넓힌다.
    backfill:
      # 포털이 데이터를 주는 첫 거래일이다(2026-09-01 직접 확인 — 2019-12-30 이하는 0건).
      # 리플레이 시즌 재료를 코로나 폭락(2020-03) 구간까지 확보하려고 끝까지 당겼다.
      from: 2020-01-02
      # 한 회차가 집는 영업일 수. KOSPI 필터가 켜져 있으면 하루 1콜이라 회차당 20콜쯤이고,
      # 전 종목이면 하루 3콜이라 회차당 60콜쯤이다.
      chunk-size: 20
      # 평소에는 꺼 둔다("-"). 백필할 때만 BACKFILL_CRON 으로 켠다 — 예: "0 */2 * * * *"
      # (2분마다 20영업일, 약 1,660영업일이면 세 시간쯤). 배포는 GitLab CI/CD 변수로 넣고
      # 끝나면 변수를 지운다. 빈 값("BACKFILL_CRON=")은 금지 — 기본값이 아니라 빈 cron 이
      # 되어 기동이 깨진다. 변수를 아예 없애면 기본 "-" 로 돌아온다.
      cron: ${BACKFILL_CRON:-}

    # 지수·환율 수집(ANT-DATA-04). 코스피·코스닥은 「금융위원회_지수시세정보」(같은 포털 키,
    # 활용신청은 따로), 원/달러는 한국수출입은행 환율 API. 둘 다 index_quotes 에 들어간다.
    # 백필 스위치가 없다 — DB 가 비어 있으면 첫 회차가 from 부터 어제까지 한 번에 받는다.
    # 지수는 구간 조회라 페이지 300장쯤, 환율은 날짜별 1콜이라 일 1,000콜 한도로 이틀에 걸쳐 끝난다.
    index:
      base-url: https://apis.data.go.kr/1160100/service/GetMarketIndexInfoService
      # 매 회차 마지막 날짜에서 이만큼 되돌아가 다시 받는다. 홈 미니차트가 30 영업일이라
      # 달력 45일은 덮어야 한다. 값이 커도 페이지 몇 장 차이다.
      lookback-days: 45
      # 포털이 지수 데이터를 주는 첫 날. 주식 backfill.from 과 같다.
      from: 2020-01-02
      # 포털이 지수를 "영업일 하루 뒤 13시 이후"에 올리는데 정확한 시각이 없다(2026-09-03 실측:
      # 11시 없음, 14:44 있음). 한 번만 돌리면 그날 공개 시각에 따라 하루를 통째로 놓치므로
      # 13~18시 매시 돈다 — 멱등 upsert 라 몇 번 받아도 같고, 회차당 포털 몇 콜·환율 0~2콜이다.
      # 앱을 14시 뒤에 켠 로컬도 다음 정시에 받는다.
      cron: "0 0 13-18 * * MON-FRI"
    fx:
      # 2025-06-25 부터 oapi. 도메인이다. 옛 www. 도메인은 2026-04-30 에 끊겼다.
      base-url: https://oapi.koreaexim.go.kr/site/program/financial/exchangeJSON
      # 수출입은행 인증키. 비어 있으면 환율 수집만 건너뛴다 — 지수는 그대로 받는다.
      auth-key: ${KOREAEXIM_AUTH_KEY:}

  # 뉴스 수집(ANT-RESEARCH-02). 네이버가 검색 API 를 NAVER API HUB(네이버 클라우드 플랫폼)로
  # 옮기면서 주소와 인증 헤더가 모두 바뀌었다 — 구 개발자센터의 X-Naver-Client-Id 가 아니라
  # X-NCP-APIGW-API-KEY-ID 다. 자격증명이 비어 있으면 수집을 건너뛴다.
  naver-news:
    key-id: ${NAVER_API_KEY_ID:}
    key: ${NAVER_API_KEY:}
    base-url: https://naverapihub.apigw.ntruss.com/search/v1
    # 종목당 한 회차에 받을 기사 수. HUB 상한이 100 이다. 매일 도는 배치라 하루치를 덮으면 된다.
    display-per-stock: 20
    # 이 구간보다 오래된 기사는 버린다. 뉴스가 뜸한 종목에서 몇 달 전 기사가 딸려 온다.
    lookback-days: 14
    # 매일 20:00 KST. 장 마감(15:30) 뒤 마감 기사까지 담는다.
    cron: "0 0 20 * * *"

  # LLM 생성(배치 B6). SSAFY GMS 는 OpenAI Chat Completions 를 그대로 프록시한다 —
  # 주소만 게이트웨이 앞단이 다르고 요청·응답 모양은 OpenAI 규격과 같다.
  # 키가 비어 있으면 생성 배치만 건너뛴다 — 수집과 조회는 그대로 돈다.
  # 같은 규격을 받는 다른 제공자(Gemini OpenAI 호환 엔드포인트 등)는 base-url·키·모델 셋만
  # 바꾸면 코드 그대로 붙는다 — .env.example 의 AI 절 참고.
  ai:
    api-key: ${AI_API_KEY:}
    base-url: ${AI_BASE_URL:https://gms.ssafy.io/gmsapi/api.openai.com/v1}
    # ★ 재개 전에 모델부터 다시 고른다 (2026-09-09 · 김성령/KSR).
    #   과금이 감당이 안 돼서 아래 generation-cron 을 꺼 뒀다. 그 뒤 종목 단위 배치를
    #   없애 하루 1콜이 됐다(아래 배치 B6 주석). 무료 Gemini 로 돌리려면 .env.example 의 AI 절.
    model: ${AI_MODEL:gpt-5.4-mini}
    # 생성물에 남기는 세대 태그. 프롬프트를 고치면 이 값을 올린다 — 옛 값 행만 골라
    # 다시 생성된다. 값을 그대로 두고 프롬프트만 고치면 이미 만들어진 문장이 갱신되지 않는다.
    prompt-version: v2
    #
    # ── 배치 B6 (2026-09-09 개편) ──────────────────────────────────────────────
    # 배치가 부르는 LLM 은 시장 브리핑 하루 1콜뿐이다. 종목 브리핑(≈300콜/일)은 없앴고, 투자
    # 포인트(≈300콜/일)는 사용자가 예측 탭에서 요청한 종목만 그 자리에서 만들어 저장한다 —
    # 같은 종목·같은 거래일은 한 번. 뉴스 AI 요약(≈900콜/일)도 같은 날 없앴다.
    # 그 전 구조(하루 ≈1,600콜)가 2026-09-08 20:43 KST 에 GMS 토큰을 바닥냈다.
    #
    # "-" 는 Spring 의 cron 비활성 표시(Scheduled.CRON_DISABLED) — 사고 직후 껐다(김성령/KSR).
    # 켜려면 "0 30 20 * * *" (뉴스 수집 20:00 의 30분 뒤). 하루 1콜이라 다시 켜도 된다.
    generation-cron: "-"
    #
    # ── 자체 서빙(교내 GPU) ────────────────────────────────────────────────────
    # 위 app.ai 와 나눈 이유는 품질과 한도가 반대라서다. 문장을 만드는 일(포인트·브리핑·복기)은
    # 상용 모델이 낫고 호출이 적다. 뉴스 관련도 판정은 기사 한 건에 한 콜이라 하루 1,000콜을
    # 넘겨 무료 티어 한도를 넘는데, 짧은 이진 답이라 자체 서빙 모델로 충분하다.
    #
    # 교내 GPU 는 vLLM 이 OpenAI Chat Completions 를 그대로 낸다 — 서버에 우리 코드는 없다.
    #   vllm serve Qwen/Qwen2.5-32B-Instruct-AWQ --port 8100 --api-key <키> \
    #     --served-model-name antenna --max-model-len 8192 --gpu-memory-utilization 0.85
    # EC2 에서 교내망으로 들어갈 수 없어 GPU 쪽에서 ssh 역터널을 건다(.env.example 의 GPU 절).
    #
    # 키·주소가 비어 있으면 판정 배치를 아예 돌리지 않는다. 그 환경에서는 재료 선정이
    # NewsIngestService.isNoise 정규식으로 떨어진다 — 거친 규칙이지만 야구 기사는 막는다.
    gpu:
      api-key: ${AI_GPU_API_KEY:}
      base-url: ${AI_GPU_BASE_URL:}
      # vLLM --served-model-name 값. 모델을 바꿔도 이 이름을 고정하면 설정이 안 바뀐다.
      model: ${AI_GPU_MODEL:antenna}
      # 판정에 남기는 세대 태그. 지시문을 고치면 올린다 — 옛 값 행만 다시 판정된다.
      prompt-version: ${AI_GPU_PROMPT_VERSION:v1}
      # 뉴스 수집(20:00) 한 시간 뒤. 터널을 세우고 나서 "0 0 21 * * *" 로 켠다.
      relevance-cron: ${AI_GPU_RELEVANCE_CRON:-}
