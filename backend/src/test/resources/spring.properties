# 스프링 테스트 컨텍스트 캐시 크기. 기본 32 → 8.
#
# 테스트 JVM 힙이 Gradle 기본값(512MB)이라, 서로 다른 컨텍스트가 30개 가까이 쌓이면 힙이 넘쳐
# OutOfMemoryError 로 스위트가 깨졌다(2026-09-11 dev, 714건 중 9건). CI 배포 잡이 test 를 돌리므로
# 그대로면 master 배포가 테스트 단계에서 멈춘다. 8 이면 넘치지 않고, GC 에 쫓기지 않아 스위트가
# 5분 남짓에서 1분 안쪽으로 줄었다.
#
# 이 값을 줄이거나 늘리기 전에 application.yaml 의 ddl-auto 주석을 먼저 본다 — 캐시에서 밀려난
# 컨텍스트가 닫힐 때 공유 H2 를 어떻게 다루는지가 그 설정에 달려 있다.
spring.test.context.cache.maxSize=8
