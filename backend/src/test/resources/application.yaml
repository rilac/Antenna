# 테스트는 DB 컨테이너 없이 돈다. 컨텍스트 로딩이 곧 엔티티 매핑 검증이다.
spring:
  # 업로드 상한(ANT-COMMUNITY-06). app.uploads.max-bytes(5MB) 보다 <b>커야</b> 한다 —
  # 같은 값이면 서블릿이 먼저 끊어 서비스의 검사가 영영 실행되지 않고, 더 작으면 5MB 이하
  # 파일까지 컨테이너가 잘라낸다. 여기는 마지막 방어선이고 실제 상한은 app.uploads 쪽이다.
  servlet:
    multipart:
      max-file-size: 6MB
      max-request-size: 8MB

  datasource:
    url: jdbc:h2:mem:antenna;MODE=PostgreSQL;DB_CLOSE_DELAY=-1
    driver-class-name: org.h2.Driver
    username: sa
    password:

  jpa:
    hibernate:
      ddl-auto: create-drop
    open-in-view: false
    defer-datasource-initialization: true

  # append-only 트리거(db/append-only.sql)는 plpgsql 이라 H2 에서 돌지 않는다(mode: never).
  # 이 파일이 main 의 application.yaml 을 가리므로 위치·구분자는 여기에도 같게 둔다.
  # PostgreSQL Testcontainers 테스트(AppendOnlyTriggerTest)가 mode 만 always 로 켠다.
  sql:
    init:
      mode: never
      schema-locations: classpath:db/append-only.sql
      separator: "^^^ END OF SCRIPT ^^^"

  # 컨텍스트 로딩용 더미. 테스트는 구글과 통신하지 않는다.
  security:
    oauth2:
      client:
        registration:
          google:
            client-id: test-client-id
            client-secret: test-client-secret
            scope: openid,email,profile

  # 이 파일이 main 의 application.yaml 을 가리므로 KoreaeximFxClient 가 찾는 신뢰 묶음도 여기 있어야
  # 컨텍스트가 뜬다. 인증서는 main 리소스의 것을 그대로 읽는다 — 파일이 깨지면 여기서 먼저 잡힌다.
  ssl:
    bundle:
      pem:
        koreaexim:
          truststore:
            certificate: classpath:certs/koreaexim-ca.crt

app:
  auth:
    # SSAFY 는 미설정 상태를 그대로 둔다 — 테스트는 SSAFY 와 통신하지 않고,
    # 설정이 없을 때 로그인이 501 로 막히는 것도 검증 대상이다.
    ssafy:
      client-id:
      client-secret:
      token-uri:
      user-info-uri:
      user-name-attribute:
      email-attribute:
    jwt-secret: test-secret-key-for-context-loading-only-32b
    access-ttl-minutes: 30
    refresh-ttl-days: 14
    cookie-secure: false
  cors:
    allowed-origins: http://localhost:5173

  # 토큰 금액표(ANT-TOKEN-08). 이 파일이 main 의 application.yaml 을 가리고 TokenAmountProperties 는 코드 기본값이 없어서,
  # 여기 없으면 컨텍스트가 안 뜬다. 값은 main 과 같게 둔다.
  token:
    amounts:
      signup-bonus: 10000
      slot-over: 1000
      ad-per-day: 1000

  # 판정 배치(ANT-PRED-03·04). "-" 는 스프링의 스케줄 비활성 표시다 — 등록은 검증되고 실행만 빠진다.
  # 켜 두면 테스트 중에 배치가 H2 의 픽스처를 전이시켜 다른 테스트가 흔들린다.
  prediction:
    settle-cron: "-"

  # 주소·RPC·키 미설정 상태가 곧 검증 대상이다 — 배포 전에도 컨텍스트가 떠야 한다.
  # 앵커 배치 테스트는 FakeAnchorRelayer(@Primary)를 쓰고 스케줄은 "-" 로 끈다.
  chain:
    chain-id: 31337
    rpc-url:
    relayer:
      private-key:
    commit-anchor:
      address:
    anchor:
      cron: "-"
      receipt-timeout-seconds: 1
      retry:
        count: 3
        delay-seconds: 0
    # 인덱서 테스트는 FakeChainLogSource(@Primary)를 쓰고 스케줄은 "-" 로 끈다.
    indexer:
      cron: "-"
      from-block: 0
      max-block-range: 10000

  # 테스트는 DART 와 통신하지 않는다. 키가 없을 때 수집이 스스로 멈추는 것도 검증 대상이다.
  dart:
    api-key:
    lookback-days: 7
    # "-" 는 스프링의 스케줄 비활성 표시다. 등록은 검증되고 실행만 빠진다.
    disclosure-cron: "-"
    profile-cron: "-"
    financial-cron: "-"

  # 테스트는 네이버·GMS 와 통신하지 않는다. 키가 비어 있을 때 수집·요약이 스스로 멈추는 것도 검증 대상이다.
  naver-news:
    key-id:
    key:
    cron: "-"
  ai:
    api-key:
    prompt-version: v1
    generation-cron: "-"

  # 테스트는 포털과 통신하지 않는다. 키가 비어 있을 때 수집이 스스로 멈추는 것도 검증 대상이다.
  market-data:
    service-key:
    base-url: http://portal.test/GetStockSecuritiesInfoService
    page-size: 100
    lookback-days: 10
    # 수집 범위 축소(KOSPI 300)는 운영 결정이라 테스트 기본값은 전 종목이다.
    market-filter:
    top-count: 0
    # "-" 는 스프링의 스케줄 비활성 표시다. 등록은 검증되고 실행만 빠진다.
    cron: "-"
    backfill:
      from: 2023-09-01
      chunk-size: 20
      cron: "-"
    # 지수·환율(ANT-DATA-04)도 통신하지 않는다. 환율 키가 비었을 때 건너뛰는 것이 검증 대상이다.
    index:
      base-url: http://portal.test/GetMarketIndexInfoService
      lookback-days: 45
      from: 2020-01-02
      cron: "-"
    fx:
      base-url: http://fx.test/exchangeJSON
      auth-key:
