<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 520" width="560" height="520" role="img" aria-label="ANTENA 마스코트와 데이터 카드 일러스트">
  <defs>
    <linearGradient id="glass" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity=".92"/>
      <stop offset="1" stop-color="#dcdcfa" stop-opacity=".55"/>
    </linearGradient>
    <linearGradient id="arrow" x1="0" y1="1" x2="1" y2="0">
      <stop offset="0" stop-color="#8b8bf0"/>
      <stop offset="1" stop-color="#5457e8"/>
    </linearGradient>
    <linearGradient id="visor" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#7d7ff2"/>
      <stop offset="1" stop-color="#4b4ed8"/>
    </linearGradient>
    <linearGradient id="shell" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#3b3b4d"/>
      <stop offset="1" stop-color="#22222e"/>
    </linearGradient>
    <radialGradient id="halo" cx=".5" cy=".5" r=".5">
      <stop offset="0" stop-color="#c9c9f8" stop-opacity=".55"/>
      <stop offset="1" stop-color="#c9c9f8" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <circle cx="290" cy="270" r="240" fill="url(#halo)"/>

  <!-- 뒤쪽 상승 화살표 -->
  <g transform="translate(0 -6)">
    <path d="M330 350 C 372 330 404 292 424 236 L 424 236" fill="none" stroke="url(#arrow)" stroke-width="26" stroke-linecap="round" opacity=".95"/>
    <path d="M392 214 L 452 196 L 440 258 Z" fill="#5457e8"/>
  </g>

  <!-- 유리 카드: 라인 차트 -->
  <g transform="rotate(-7 180 210)">
    <rect x="126" y="140" width="128" height="164" rx="22" fill="url(#glass)" stroke="#ffffff" stroke-width="2"/>
    <polyline points="146,254 172,220 196,238 222,182" fill="none" stroke="#5457e8" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/>
    <circle cx="146" cy="254" r="6" fill="#fff" stroke="#5457e8" stroke-width="4"/>
    <circle cx="222" cy="182" r="6" fill="#fff" stroke="#5457e8" stroke-width="4"/>
  </g>

  <!-- 유리 카드: 막대 차트 -->
  <g transform="rotate(4 190 380)">
    <rect x="140" y="306" width="122" height="150" rx="22" fill="url(#glass)" stroke="#ffffff" stroke-width="2"/>
    <rect x="164" y="398" width="18" height="36" rx="8" fill="#ffffff"/>
    <rect x="192" y="372" width="18" height="62" rx="8" fill="#ffffff"/>
    <rect x="220" y="346" width="18" height="88" rx="8" fill="#ffffff"/>
  </g>

  <!-- 도넛 차트 -->
  <g transform="translate(96 300)">
    <circle cx="0" cy="0" r="42" fill="#ffffff" opacity=".85"/>
    <path d="M0 -42 A42 42 0 0 1 36 21 L0 0 Z" fill="#5457e8"/>
    <path d="M36 21 A42 42 0 0 1 -36 21 L0 0 Z" fill="#9b9df5"/>
    <circle cx="0" cy="0" r="16" fill="#ffffff"/>
  </g>

  <!-- 오른쪽 카드 -->
  <rect x="392" y="300" width="96" height="132" rx="22" fill="url(#glass)" stroke="#ffffff" stroke-width="2" transform="rotate(6 440 366)"/>

  <!-- 마스코트 -->
  <g>
    <!-- 더듬이 -->
    <path d="M266 214 C 258 186 246 170 232 160" fill="none" stroke="#2b2b39" stroke-width="7" stroke-linecap="round"/>
    <path d="M318 214 C 326 186 338 170 352 160" fill="none" stroke="#2b2b39" stroke-width="7" stroke-linecap="round"/>
    <circle cx="228" cy="156" r="11" fill="#2b2b39"/>
    <circle cx="356" cy="156" r="11" fill="#2b2b39"/>

    <!-- 다리 -->
    <rect x="256" y="402" width="26" height="46" rx="13" fill="#2b2b39"/>
    <rect x="302" y="402" width="26" height="46" rx="13" fill="#2b2b39"/>
    <ellipse cx="269" cy="452" rx="21" ry="11" fill="#22222e"/>
    <ellipse cx="315" cy="452" rx="21" ry="11" fill="#22222e"/>

    <!-- 몸통 -->
    <rect x="250" y="318" width="84" height="98" rx="34" fill="url(#shell)"/>
    <path d="M292 344 l14 30 h-9 l-5 -11 -5 11 h-9 z" fill="#7d7ff2"/>
    <!-- 꼬리(복부) -->
    <ellipse cx="352" cy="392" rx="26" ry="22" fill="#2b2b39"/>

    <!-- 팔 -->
    <path d="M254 344 C 226 356 214 376 214 394" fill="none" stroke="#2b2b39" stroke-width="16" stroke-linecap="round"/>
    <path d="M332 348 C 356 352 366 362 368 372" fill="none" stroke="#2b2b39" stroke-width="16" stroke-linecap="round"/>

    <!-- 돋보기 -->
    <circle cx="222" cy="368" r="34" fill="#ffffff" opacity=".5"/>
    <circle cx="222" cy="368" r="34" fill="none" stroke="#2b2b39" stroke-width="9"/>
    <path d="M246 392 L 266 412" stroke="#2b2b39" stroke-width="13" stroke-linecap="round"/>

    <!-- 머리 -->
    <rect x="238" y="206" width="108" height="106" rx="46" fill="url(#shell)"/>
    <rect x="252" y="232" width="80" height="54" rx="26" fill="url(#visor)"/>
    <path d="M268 258 q7 -10 14 0" fill="none" stroke="#eef0ff" stroke-width="6" stroke-linecap="round"/>
    <path d="M302 258 q7 -10 14 0" fill="none" stroke="#eef0ff" stroke-width="6" stroke-linecap="round"/>
    <path d="M286 268 q6 8 12 0 z" fill="#eef0ff"/>
  </g>

  <!-- 반짝임 -->
  <path d="M470 262 l7 17 17 7 -17 7 -7 17 -7 -17 -17 -7 17 -7 z" fill="#a5a7f7"/>
  <path d="M120 452 l5 12 12 5 -12 5 -5 12 -5 -12 -12 -5 12 -5 z" fill="#c3c4fa"/>
  <circle cx="418" cy="450" r="9" fill="#d5d6fb"/>
  <circle cx="442" cy="470" r="5" fill="#e2e3fd"/>
</svg>
