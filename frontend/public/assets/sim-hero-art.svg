<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 420" width="560" height="420" role="img" aria-label="차트 패널을 가리키는 ANTENA 마스코트">
  <defs>
    <linearGradient id="shSuit" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#3c3c4e"/><stop offset="1" stop-color="#1c1c27"/>
    </linearGradient>
    <linearGradient id="shHelm" x1=".2" y1="0" x2=".8" y2="1">
      <stop offset="0" stop-color="#45455c"/><stop offset="1" stop-color="#1e1e2a"/>
    </linearGradient>
    <radialGradient id="shFace" cx=".42" cy=".38" r=".7">
      <stop offset="0" stop-color="#fff8ee"/><stop offset="1" stop-color="#f6e3ce"/>
    </radialGradient>
    <linearGradient id="shVisor" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#a99bfb" stop-opacity=".95"/><stop offset="1" stop-color="#7b6cf0" stop-opacity=".95"/>
    </linearGradient>
    <linearGradient id="shPanel" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity=".9"/><stop offset="1" stop-color="#dedcfa" stop-opacity=".5"/>
    </linearGradient>
    <radialGradient id="shOrb" cx=".38" cy=".3" r=".72">
      <stop offset="0" stop-color="#8f8bf5" stop-opacity=".8"/><stop offset="1" stop-color="#2f2a7a" stop-opacity=".9"/>
    </radialGradient>
    <radialGradient id="shGlow" cx=".5" cy=".5" r=".5">
      <stop offset="0" stop-color="#c9c6fa" stop-opacity=".45"/><stop offset="1" stop-color="#c9c6fa" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <ellipse cx="280" cy="230" rx="270" ry="200" fill="url(#shGlow)"/>

  <!-- 유리 차트 패널 -->
  <g>
    <rect x="304" y="66" width="216" height="216" rx="20" fill="url(#shPanel)" stroke="#ffffff" stroke-width="2"/>
    <circle cx="334" cy="96" r="14" fill="#6d64e8"/>
    <text x="334" y="102" text-anchor="middle" font-family="sans-serif" font-size="15" font-weight="700" fill="#fff">₩</text>
    <rect x="356" y="89" width="70" height="7" rx="3.5" fill="#c9c7ee" opacity=".8"/>
    <rect x="356" y="102" width="44" height="6" rx="3" fill="#d9d8f2" opacity=".8"/>
    <polyline points="324,206 350,190 372,198 396,168 420,178 444,146 470,158 498,116"
      fill="none" stroke="#8d84f0" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
    <circle cx="498" cy="116" r="6" fill="#6d64e8"/>
    <g fill="#b9b6ee" opacity=".85">
      <rect x="324" y="234" width="18" height="26" rx="4"/>
      <rect x="352" y="222" width="18" height="38" rx="4"/>
      <rect x="380" y="242" width="18" height="18" rx="4"/>
      <rect x="408" y="212" width="18" height="48" rx="4"/>
      <rect x="436" y="230" width="18" height="30" rx="4"/>
      <rect x="464" y="204" width="18" height="56" rx="4"/>
    </g>
  </g>

  <!-- 마스코트 -->
  <g>
    <!-- 더듬이 -->
    <path d="M182 86c-7-18-16-28-25-34" stroke="#2c2c3a" stroke-width="8" stroke-linecap="round" fill="none"/>
    <path d="M256 82c8-17 18-26 28-31" stroke="#2c2c3a" stroke-width="8" stroke-linecap="round" fill="none"/>
    <circle cx="153" cy="46" r="17" fill="#9b7ff6"/><circle cx="147" cy="39" r="6" fill="#d7c9ff" opacity=".85"/>
    <circle cx="288" cy="45" r="17" fill="#63b8f7"/><circle cx="282" cy="38" r="6" fill="#cbe8ff" opacity=".85"/>

    <!-- 다리 · 발 -->
    <rect x="176" y="322" width="30" height="52" rx="15" fill="#23232f"/>
    <rect x="222" y="322" width="30" height="52" rx="15" fill="#23232f"/>
    <ellipse cx="191" cy="378" rx="26" ry="13" fill="#2c2c3a"/>
    <ellipse cx="237" cy="378" rx="26" ry="13" fill="#2c2c3a"/>

    <!-- 네트워크 구체 -->
    <g transform="translate(276 318)">
      <circle r="46" fill="url(#shOrb)"/>
      <ellipse rx="46" ry="17" fill="none" stroke="#a9a5f7" stroke-width="1.2" opacity=".6"/>
      <ellipse rx="17" ry="46" fill="none" stroke="#a9a5f7" stroke-width="1.2" opacity=".6"/>
      <ellipse rx="34" ry="46" fill="none" stroke="#a9a5f7" stroke-width="1" opacity=".4"/>
      <g fill="#cfccfd"><circle cx="-24" cy="-18" r="3"/><circle cx="14" cy="-30" r="2.6"/><circle cx="30" cy="12" r="3"/><circle cx="-10" cy="26" r="2.6"/></g>
      <g stroke="#cfccfd" stroke-width="1" opacity=".7" fill="none"><path d="M-24-18 14-30 30 12-10 26z"/></g>
    </g>

    <!-- 몸통 -->
    <ellipse cx="214" cy="288" rx="58" ry="52" fill="url(#shSuit)"/>
    <path d="M214 270l15 9v17l-15 9-15-9v-17z" fill="none" stroke="#8f8bf2" stroke-width="3.6" stroke-linejoin="round"/>

    <!-- 가리키는 팔 -->
    <path d="M168 274c-22-10-32-32-32-56" stroke="#26262f" stroke-width="21" stroke-linecap="round" fill="none"/>
    <circle cx="136" cy="212" r="21" fill="#2c2c3a"/>
    <rect x="127" y="166" width="17" height="44" rx="8.5" fill="#2c2c3a"/>

    <!-- 구체 쪽 팔 -->
    <path d="M262 282c14 4 22 12 25 22" stroke="#26262f" stroke-width="19" stroke-linecap="round" fill="none"/>

    <!-- 머리 -->
    <ellipse cx="218" cy="196" rx="84" ry="80" fill="url(#shHelm)"/>
    <ellipse cx="220" cy="202" rx="59" ry="57" fill="url(#shFace)"/>
    <ellipse cx="142" cy="202" rx="15" ry="22" fill="#3a3a4d"/>
    <ellipse cx="296" cy="202" rx="15" ry="22" fill="#3a3a4d"/>

    <!-- VR 고글 -->
    <rect x="150" y="152" width="140" height="72" rx="34" fill="url(#shVisor)"/>
    <rect x="150" y="152" width="140" height="72" rx="34" fill="none" stroke="#6f61ea" stroke-width="4"/>
    <rect x="140" y="176" width="14" height="24" rx="7" fill="#6f61ea"/>
    <rect x="286" y="176" width="14" height="24" rx="7" fill="#6f61ea"/>
    <path d="M176 196q13 -20 26 0" stroke="#f2f0ff" stroke-width="7" stroke-linecap="round" fill="none"/>
    <path d="M238 196q13 -20 26 0" stroke="#f2f0ff" stroke-width="7" stroke-linecap="round" fill="none"/>
    <ellipse cx="168" cy="180" rx="16" ry="9" fill="#ffffff" opacity=".3" transform="rotate(-18 168 180)"/>

    <!-- 볼 · 입 -->
    <ellipse cx="172" cy="234" rx="13" ry="8" fill="#f2a8b6" opacity=".75"/>
    <ellipse cx="268" cy="234" rx="13" ry="8" fill="#f2a8b6" opacity=".75"/>
    <path d="M204 232q16 26 32 0z" fill="#c9455a"/>
    <path d="M204 232q16 6 32 0" stroke="#fff" stroke-width="4" fill="none" stroke-linecap="round"/>
  </g>
</svg>
