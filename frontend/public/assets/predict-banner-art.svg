<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 460 300" width="460" height="300" role="img" aria-label="네트워크 구체 옆에서 손을 흔드는 ANTENA 마스코트">
  <defs>
    <linearGradient id="pbSuit" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#3a3a4b"/><stop offset="1" stop-color="#1b1b26"/>
    </linearGradient>
    <linearGradient id="pbHelm" x1=".2" y1="0" x2=".8" y2="1">
      <stop offset="0" stop-color="#43435a"/><stop offset="1" stop-color="#1d1d29"/>
    </linearGradient>
    <radialGradient id="pbFace" cx=".42" cy=".36" r=".72">
      <stop offset="0" stop-color="#fff7ec"/><stop offset="1" stop-color="#f6e2cd"/>
