# 앤테나 nginx 설정
#
# 배치: 이 파일을 서버의 /etc/nginx/sites-available/antenna 로 복사하고
#       /etc/nginx/sites-enabled/ 에 심볼릭 링크를 건다.
#
# 인증서는 certbot certonly --webroot 로 발급받는다(--nginx 플러그인 아님).
# 플러그인 모드는 certbot 이 이 파일을 직접 고쳐서 저장소 사본과 서버 사본이
# 갈라진다. webroot 방식은 설정을 건드리지 않으므로 이 파일이 계속 정본이 된다.

# HTTP: 인증서 갱신 통로만 남기고 전부 HTTPS 로 보낸다.
server {
    listen 80;
    listen [::]:80;
    server_name stock-antenna.com www.stock-antenna.com j15a507.p.ssafy.io;

    # 갱신용 ACME 챌린지. ^~ 로 우선순위를 올려 아래 리다이렉트에 먹히지 않게 한다.
    location ^~ /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://stock-antenna.com$request_uri;
    }
}

# www 와 SSAFY 도메인은 apex(stock-antenna.com)로 통일한다.
# 프론트가 redirect_uri 를 window.location.origin 으로 만들기 때문에(auth.ts),
# 접속 도메인이 갈리면 구글 승인 리디렉션 URI 를 그 수만큼 등록해야 한다.
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name www.stock-antenna.com j15a507.p.ssafy.io;

    ssl_certificate     /etc/letsencrypt/live/stock-antenna.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/stock-antenna.com/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 1d;

    return 301 https://stock-antenna.com$request_uri;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name stock-antenna.com;

    ssl_certificate     /etc/letsencrypt/live/stock-antenna.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/stock-antenna.com/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 1d;

    root /srv/antenna/frontend;
    index index.html;

    # 번들이 600KB 대라 압축이 체감된다. nginx 기본값은 text/html 만 압축한다.
    gzip on;
    gzip_min_length 1024;
    gzip_types text/css application/javascript application/json image/svg+xml;

    # Vite 청크는 파일명에 해시가 붙으므로 영구 캐시해도 안전하다.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # index.html 은 캐시하면 안 된다. 캐시되면 배포 후에도 브라우저가
    # 옛 청크 이름을 계속 요청해서 화면이 갱신되지 않는다.
    location = /index.html {
        add_header Cache-Control "no-store";
    }

    # react-router SPA. 이 줄이 없으면 /oauth/callback/google 로 돌아오는
    # 구글 로그인 콜백이 nginx 404 가 된다.
    location / {
        try_files $uri $uri/ /index.html;
    }

    location /api/ {
        proxy_pass http://127.0.0.1:8080;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
